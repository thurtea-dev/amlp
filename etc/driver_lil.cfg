# amlp config -- boots this driver's own bundled Lil mudlib (mudlib/),
# not the test/mudlib_stub the default etc/driver.cfg uses. Written to
# bring the real driver online for manual testing.
mud_name: Lil
mudlib_root: mudlib
master_file: /single/master
simul_efun_file: /single/simul_efun
include_dir: include
global_include_file: <config.h>
port: 4000
heartbeat_interval_ms: 2000
max_eval_cost: 10000000
