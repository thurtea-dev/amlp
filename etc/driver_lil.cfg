# amlp config -- boots this driver's own bundled mudlib (mudlib/,
# "library" -- a stripped-down rebuild of Lil, see
# mudlib/LIBRARY_MUDLIB_PLAN.md), not the test/mudlib_stub the default
# etc/driver.cfg uses. Written to bring the real driver online for
# manual testing. Filename kept as driver_lil.cfg despite the rename --
# only the mud_name value below actually changed.
mud_name: Library
mudlib_root: mudlib
master_file: /single/master
simul_efun_file: /single/simul_efun
include_dir: include
global_include_file: <config.h>
port: 4000
heartbeat_interval_ms: 2000
max_eval_cost: 10000000
